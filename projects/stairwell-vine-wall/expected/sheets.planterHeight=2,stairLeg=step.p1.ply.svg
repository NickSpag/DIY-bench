<g class="wb-placement" data-part="planter-back"><title>Planter back · 43¾ × 18 · planter-back</title><rect class="wb-part k-fin" x="0" y="0" width="43.75" height="18"/><text class="wb-label" x="21.875" y="8.64" font-size="1.2" text-anchor="middle">Planter back</text><text class="wb-size" x="21.875" y="10.08" font-size="1.2" text-anchor="middle">43¾ × 18</text></g>
<g class="wb-placement" data-part="planter-bottom"><title>Planter bottom · 43¾ × 9¹⁹⁄₃₂ · planter-bottom</title><rect class="wb-part k-fin" x="0" y="18.125" width="43.75" height="9.5938"/><text class="wb-label" x="21.875" y="22.5619" font-size="1.2" text-anchor="middle">Planter bottom</text><text class="wb-size" x="21.875" y="24.0019" font-size="1.2" text-anchor="middle">43¾ × 9¹⁹⁄₃₂</text></g>
</g>
