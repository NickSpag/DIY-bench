<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2.4 -2.4 100.8 64.08" class="wb-sheets" data-phase="p2" data-material="lattice" font-family="ui-monospace, monospace">
<style>
.wb-sheet-board { fill: var(--sheet-board, #f4f1ea); stroke: var(--ink, #222); stroke-width: var(--sheet-stroke, 0.3); }
.wb-part { stroke: var(--wood-dark, #8a6a3f); stroke-width: 0.2; }
.wb-part.k-fin { fill: var(--face, #e8d3ad); }
.wb-part.k-raw { stroke: var(--ink-soft, #6b7378); }
.wb-part.k-needs-finish { stroke: var(--dim, #2f6fb2); stroke-width: 0.45; }
.wb-hatch-bg { fill: var(--sheet-board, #f4f1ea); }
.wb-hatch-line { stroke: var(--hatch, #8f9ba1); stroke-width: 0.25; }
.wb-strip-cut { stroke: var(--ink-soft, #6b7378); stroke-width: 0.2; stroke-dasharray: 0.8 0.5; fill: none; }
.wb-offcut { fill: none; stroke: var(--ink-soft, #6b7378); stroke-width: 0.18; stroke-dasharray: 0.8 0.6; }
.wb-title { fill: var(--ink-soft, #6b7378); }
.wb-label { fill: var(--ink, #222); }
.wb-size { fill: var(--ink-soft, #6b7378); }
.wb-offcut-label { fill: var(--ink-soft, #6b7378); }
.wb-grain { stroke: var(--dim, #2f6fb2); stroke-width: 0.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.wb-grain-label { fill: var(--dim, #2f6fb2); }
</style>
<defs><pattern id="wb-raw-p2-lattice" patternUnits="userSpaceOnUse" width="1.44" height="1.44" patternTransform="rotate(45)"><rect class="wb-hatch-bg" width="1.44" height="1.44"/><line class="wb-hatch-line" x1="0" y1="0" x2="0" y2="1.44"/></pattern></defs>
<g class="wb-sheet" data-sheet="0" data-stock="4x8" data-owned="true" transform="translate(0 5.28)">
<text class="wb-title" x="0" y="-1.68" font-size="2.277">4×8 (owned) · Wood lattice, ¼″ slats (two layers, ½″ thick), 96 × 48</text>
<g class="wb-grain-arrow"><path class="wb-grain" d="M76.8 50.64H96M94.56 49.8L96 50.64L94.56 51.48"/><text class="wb-grain-label" x="75.84" y="51.36" font-size="1.92" text-anchor="end">grain</text></g>
<rect class="wb-sheet-board" x="0" y="0" width="96" height="48"/>
<g class="wb-offcut-g"><rect class="wb-offcut" x="31" y="0" width="65" height="48"/><text class="wb-offcut-label" x="63.5" y="24.576" font-size="1.92" text-anchor="middle">offcut 65 × 48</text></g>
<g class="wb-placement" data-part="trellis-upper" data-turned="true"><title>Trellis panel · 45⅛ × 30⅞ (turned) · trellis-upper</title><rect class="wb-part k-raw k-needs-finish" x="0" y="0" width="30.875" height="45.125" fill="url(#wb-raw-p2-lattice)"/><g transform="rotate(-90 15.4375 22.5625)"><text class="wb-label" x="15.4375" y="21.8425" font-size="2.4" text-anchor="middle">Trellis panel</text><text class="wb-size" x="15.4375" y="24.7225" font-size="2.4" text-anchor="middle">45⅛ × 30⅞</text></g></g>
</g>
</svg>
