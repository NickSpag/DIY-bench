<style>
.wb-drawing text { font-family: var(--f-mono, ui-monospace, "SF Mono", Menlo, monospace); }
.wb-drawing .f-wall { fill: color-mix(in oklab, var(--wallface, #eff2f2) var(--hl-mix, 100%), var(--hl, #000)); }
